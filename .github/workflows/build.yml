name: Build Android APK

# Когда запускать сборку:
on:
  workflow_dispatch: # Сборка по кнопке вручную
  push:
    branches: [ main ] # Автоматическая сборка при пуше в ветку main

jobs:
  build:
    runs-on: ubuntu-latest # Используем виртуальную машину Linux от GitHub

    steps:
    # 1. Скачиваем код вашего репозитория на виртуалку
    - name: Checkout code
      uses: actions/checkout@v4

    # 2. Устанавливаем Java (нужна для Android)
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: 17

    # 3. Устанавливаем Android SDK
    - name: Set up Android SDK
      uses: android-actions/setup-android@v3

    # 4. Запускаем саму сборку. 
    # Если нужно собрать релиз (release), замени assembleDebug на assembleRelease
    - name: Build Debug APK
      run: ./gradlew assembleDebug

    # 5. Сохраняем готовый APK, чтобы его можно было скачать
    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/app-debug.apk
