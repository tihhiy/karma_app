workflows:
  build-android:
    name: Build Android APK
    environment:
      vars:
        # Здесь можно добавить переменные, если нужно
      flutter: stable
    scripts:
      - name: Get dependencies
        script: |
          flutter pub get
      - name: Build APK
        script: |
          flutter build apk --release
    artifacts:
      - build/**/outputs/apk/**/*.apk
