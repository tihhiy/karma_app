workflows:
  build-android:
    name: Build Android APK
    environment:
      vars: {}
      flutter: stable
      java: openjdk17
    scripts:
      - name: Get dependencies
        script: |
          flutter pub get
      - name: Build APK
        script: |
          flutter build apk --release
    artifacts:
      - build/**/outputs/apk/**/*.apk
